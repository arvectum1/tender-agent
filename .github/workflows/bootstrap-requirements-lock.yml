name: Bootstrap requirements lock

on:
  push:
    branches:
      - chore/reproducible-dependencies

permissions:
  contents: write

jobs:
  generate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Generate universal hashed requirements lock
        run: >-
          uv pip compile pyproject.toml
          --extra dev
          --python-version 3.11
          --universal
          --generate-hashes
          --output-file requirements.lock
      - name: Install exactly locked dependencies
        run: uv pip install --system --require-hashes -r requirements.lock
      - name: Install project without resolving dependencies
        run: python -m pip install --no-deps -e .
      - name: Run focused P8.04/P8.05 offline tests
        run: python -m pytest -q tests/test_p8_04_eis_temporal_revalidation.py tests/test_p8_05_temporal_acceptance_binding.py
      - name: Commit generated lock
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- requirements.lock)" ]]; then
            echo "requirements.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements.lock
          git commit -m "chore: add reproducible requirements lock"
          git push origin HEAD:chore/reproducible-dependencies
